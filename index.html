<title>职途 · 求职工作台</title>

<style>
/* 职途 · 求职工作台 —— 单文件样式表 */
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#1d2129; --sub:#4e5969; --faint:#86909c;
  --line:#e5e6eb; --line-2:#f0f1f3; --brand:#1f5fbf; --brand-soft:#eaf1fc;
  --ok:#0e7a4f; --ok-soft:#e8f6ef; --warn:#8a5a00; --warn-soft:#fff6e5;
  --bad:#a4222f; --bad-soft:#fdecee; --radius:10px;
  --sidebar:224px; --topbar:56px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
/* ---------- 框架 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
.brand b{font-size:17px;letter-spacing:.5px}
.brand span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:8px}
.nav a{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  color:var(--sub);font-size:13.5px;margin-bottom:2px;
}
.nav a:hover{background:var(--line-2)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a .ic{width:16px;text-align:center;font-size:13px;opacity:.8}
.nav a .dot{margin-left:auto;background:#f53f3f;color:#fff;font-size:10.5px;border-radius:9px;padding:0 6px;line-height:16px}
.pro{margin:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
.pro b{font-size:12.5px;display:block}
.pro p{margin:4px 0 8px;font-size:11.5px;color:var(--faint);line-height:1.5}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--topbar);flex:0 0 var(--topbar);background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20;
}
.search{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);
  border:1px solid var(--line);border-radius:18px;padding:6px 14px;
}
.search input{border:0;background:transparent;outline:none;flex:1;font-size:13px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--bg)}
.badge-dot{position:absolute;top:5px;right:6px;width:6px;height:6px;background:#f53f3f;border-radius:50%}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.who{font-size:12.5px;color:var(--sub)}
.content{padding:22px 24px 60px;flex:1}
/* ---------- 页头 ---------- */
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px}
.page-head p{margin:4px 0 0;color:var(--faint);font-size:12.5px}
.page-head .ops{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--bad);border-color:#f3d2d6}
/* ---------- 卡片/网格 ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .t{font-size:12.5px;color:var(--faint)}
.kpi .v{font-size:23px;font-weight:600;line-height:1.35;margin-top:2px}
.kpi .v small{font-size:12px;font-weight:400;color:var(--faint);margin-left:4px}
.kpi .d{font-size:11.5px;color:var(--faint);margin-top:2px}
/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{ text-align:left;font-weight:600;color:var(--sub);background:#fafbfc;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fcfdff}
.t-title{font-weight:600}
.t-sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--line-2);color:var(--sub);margin:2px 4px 2px 0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.ghost{background:#fff;border:1px solid var(--line)}
.ops-inline{display:flex;gap:6px;flex-wrap:wrap}
.iconlink{border:0;background:transparent;cursor:pointer;padding:3px 5px;border-radius:6px;font-size:13px;color:var(--faint)}
.iconlink:hover{background:var(--line-2);color:var(--brand)}
/* ---------- 进度/条形 ---------- */
.bar{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar.ok i{background:var(--ok)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--faint);font-size:12px}
.empty{padding:34px 16px;text-align:center;color:var(--faint);font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);background:#fcfdff}
/* ---------- 时间轴 ---------- */
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 16px 4px}
.tl-item:before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.tl-item.done:before{background:var(--brand)}
.stage{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.stage .s{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--faint)}
.stage .s i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:9px;font-style:normal}
.stage .s.on{color:var(--ink)}
.stage .s.on i{background:var(--brand);border-color:var(--brand);color:#fff}
.stage .sep{width:12px;height:1px;background:var(--line)}
/* ---------- 图表 ---------- */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.hbar .b{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:4px;background:var(--brand)}
/* ---------- 时间轴卡片(投递) ---------- */
.app-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:#fff;margin-bottom:12px}
.app-card .head{display:flex;gap:10px;align-items:flex-start}
.app-card .head .n{font-weight:600}
.app-card .head .meta{font-size:12px;color:var(--faint);margin-top:2px}
.app-card .head .right{margin-left:auto;text-align:right;font-size:12px;color:var(--faint);white-space:nowrap}
/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(29,33,41,.34);display:none;place-items:center;z-index:60;padding:20px}
.mask.on{display:grid}
.modal{background:#fff;border-radius:12px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.16)}
.modal h3{font-size:16px;margin-bottom:14px}
.form{display:grid;gap:12px}
.form label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.form input,.form select,.form textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none;font-size:13px;
}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--brand)}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
/* ---------- 对话 ---------- */
.chat{display:grid;gap:10px;max-height:360px;overflow:auto;padding-right:4px}
.msg{max-width:86%;padding:9px 12px;border-radius:10px;font-size:13px;white-space:pre-wrap;line-height:1.65}
.msg.me{margin-left:auto;background:var(--brand);color:#fff}
.msg.ai{background:#f7f8fa;border:1px solid var(--line)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.feature{border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;background:#fff;text-align:left}
.feature:hover{border-color:var(--brand);background:#fbfdff}
.feature b{display:block;font-size:13.5px;margin-bottom:4px}
.feature span{font-size:12px;color:var(--faint);line-height:1.55;display:block}
/* ---------- 其它 ---------- */
.note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 11px;display:flex;gap:8px}
.note.info{color:var(--sub);background:#f7f8fa}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);background:#1d2129;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.22s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--sub);cursor:pointer}
.tab.on{background:#fff;border-color:var(--line);color:var(--ink);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:#fff;font-size:13px;outline:none}
.filters input{flex:1;min-width:180px}
/* ---------- 响应式 ---------- */
@media (max-width:1080px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:880px){
  .app{display:block}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:.22s;height:100vh;box-shadow:8px 0 24px rgba(0,0,0,.08)
  }
  .sidebar.open{transform:none}
  .main{min-height:100vh}
  .content{padding:16px 14px 70px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .topbar{padding:0 12px;gap:8px}
  .who{display:none}
  .page-head h1{font-size:18px}
  .menu-btn{display:grid !important}
  .form .row2,.form .row3{grid-template-columns:1fr}
  .hbar{grid-template-columns:80px 1fr 38px}
  .msg{max-width:94%}
}
.menu-btn{display:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;place-items:center}

</style>
</head>

/* ---- 图表（内联 SVG，无外部依赖） ---- */
function hbars(items) {
  return '<div class="hbars">' + items.map((it) => {
    const w = Math.max(0, Math.min(100, (it.value / (it.max || 100)) * 100));
    return `<div class="hbar"><span>${esc(it.label)}</span><div class="b"><i style="width:${w}%;background:${it.color || "var(--brand)"}"></i></div><span class="muted">${esc(it.text || it.value)}</span></div>`;
  }).join("") + "</div>";
}

function lineChart(labels, series, h = 190) {
  const W = 560, P = 34, top = 14, bottom = 26;
  const all = series.flatMap((s) => s.data);
  const max = Math.max(1, ...all) * 1.15;
  const x = (i) => P + (i * (W - P - 12)) / Math.max(1, labels.length - 1);
  const y = (v) => top + (h - top - bottom) * (1 - v / max);
  let grid = "";
  for (let g = 0; g <= 4; g++) {
    const yy = top + ((h - top - bottom) * g) / 4;
    grid += `<line x1="${P}" y1="${yy}" x2="${W - 12}" y2="${yy}" stroke="#f0f1f3"/>`;
  }
  const paths = series.map((s) => {
    const d = s.data.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dots = s.data.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8" fill="${s.color}"/>`).join("");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>${dots}`;
  }).join("");
  const xlab = labels.map((l, i) => `<text x="${x(i).toFixed(1)}" y="${h - 8}" font-size="10" fill="#86909c" text-anchor="middle">${esc(l)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid meet">${grid}${paths}${xlab}</svg>`;
}

function radarChart(dims, me, avg) {
  const S = 300, C = 150, R = 96;
  const n = dims.length;
  const pt = (i, r) => {
    const a = (Math.PI * 2 * i) / n - Math.PI / 2;
    return [C + Math.cos(a) * r, C + Math.sin(a) * r];
  };
  let rings = "";
  [0.25, 0.5, 0.75, 1].forEach((k) => {
    const pts = dims.map((_, i) => pt(i, R * k).map((v) => v.toFixed(1)).join(",")).join(" ");
    rings += `<polygon points="${pts}" fill="none" stroke="#eceef1"/>`;
  });
  const spokes = dims.map((_, i) => {
    const [px, py] = pt(i, R);
    return `<line x1="${C}" y1="${C}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#eceef1"/>`;
  }).join("");
  const poly = (arr, color, fill) => {
    const pts = arr.map((v, i) => pt(i, (R * v) / 100).map((p) => p.toFixed(1)).join(",")).join(" ");
    return `<polygon points="${pts}" fill="${fill}" stroke="${color}" stroke-width="2"/>`;
  };
  const labels = dims.map((d, i) => {
    const [px, py] = pt(i, R + 20);
    return `<text x="${px.toFixed(1)}" y="${(py + 3).toFixed(1)}" font-size="10.5" fill="#4e5969" text-anchor="middle">${esc(d)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${S} ${S}" style="max-width:320px;margin:0 auto">${rings}${spokes}${poly(avg, "#c9d3e3", "rgba(201,211,227,.22)")}${poly(me, "#1f5fbf", "rgba(31,95,191,.14)")}${labels}</svg>`;
}

function donut(items, size = 150) {
  const total = items.reduce((a, b) => a + b.value, 0) || 1;
  let acc = 0, arcs = "";
  const R = 60, r = 38, C = 75;
  items.forEach((it) => {
    const a0 = (acc / total) * Math.PI * 2 - Math.PI / 2;
    acc += it.value;
    const a1 = (acc / total) * Math.PI * 2 - Math.PI / 2;
    const p = (rad, a) => [C + Math.cos(a) * rad, C + Math.sin(a) * rad];
    const [x0, y0] = p(R, a0), [x1, y1] = p(R, a1), [x2, y2] = p(r, a1), [x3, y3] = p(r, a0);
    const large = a1 - a0 > Math.PI ? 1 : 0;
    arcs += `<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${it.color}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px">${arcs}</svg>`;
}

function ring(pct, size = 150, label = "") {
  const C = 75, R = 52, L = 2 * Math.PI * R;
  const v = Math.max(0, Math.min(100, pct));
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px">
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#f0f1f3" stroke-width="12"/>
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#1f5fbf" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${(L * v) / 100} ${L}" transform="rotate(-90 ${C} ${C})"/>
    <text x="${C}" y="${C + 2}" text-anchor="middle" font-size="20" font-weight="600" fill="#1d2129">${v}%</text>
    <text x="${C}" y="${C + 20}" text-anchor="middle" font-size="10" fill="#86909c">${esc(label)}</text>
  </svg>`;
}

function openModal({ title, fields, submitText = "保存", onSubmit }) {
  modalCtx = { fields, onSubmit };

    const id = "f_" + f.k;
    if (f.type === "textarea") return `<div><label>${esc(f.label)}</label><textarea id="${id}" rows="${f.rows || 3}" placeholder="${esc(f.ph || "")}">${esc(f.value || "")}</textarea></div>`;
    if (f.type === "select") return `<div><label>${esc(f.label)}</label><select id="${id}">${f.options.map((o) => `<option value="${esc(o)}" ${o === f.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
    return `<div><label>${esc(f.label)}</label><input id="${id}" type="${f.type || "text"}" value="${esc(f.value == null ? "" : f.value)}" placeholder="${esc(f.ph || "")}" ${f.step ? `step="${f.step}"` : ""}></div>`;
  }).join("");
  $("#modal").innerHTML = `<h3>${esc(title)}</h3><div class="form">${body}</div>
    <div class="foot"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-act="modal-submit">${esc(submitText)}</button></div>`;
  $("#mask").classList.add("on");
  const first = $("#modal input, #modal textarea");
  if (first) setTimeout(() => first.focus(), 40);
}
function submitModal() {
  if (!modalCtx) return;
  const out = {};
  modalCtx.fields.forEach((f) => { out[f.k] = ($("#f_" + f.k) || {}).value ?? ""; });
  modalCtx.onSubmit(out);
}

function calendarHTML() {
  const y = 2026, m = 11;
  const first = new Date(y, m - 1, 1);
  const startDow = first.getDay();
  const days = new Date(y, m, 0).getDate();
  const marks = {};
  db.interviews.forEach((i) => { if (i.date && i.date.startsWith("2026-11")) marks[Number(i.date.slice(8, 10))] = true; });
  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div style="color:#c9cdd4;text-align:center;padding:8px 0;font-size:12px"></div>`;
  for (let d = 1; d <= days; d++) {
    const isToday = d === 22;
    cells += `<div style="text-align:center;padding:8px 0;font-size:12.5px;border-radius:8px;${isToday ? "background:var(--brand);color:#fff;font-weight:600" : marks[d] ? "background:var(--brand-soft);color:var(--brand);font-weight:600" : ""}">${d}${marks[d] && !isToday ? '<div style="height:3px;border-radius:2px;background:var(--brand);margin:3px 30% 0"></div>' : ""}</div>`;
  }
  return `<div class="card"><h3>面试日历<span class="tag">2026 年 11 月</span></h3>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;color:#86909c;margin-bottom:4px">
      ${["日", "一", "二", "三", "四", "五", "六"].map((d) => `<div style="text-align:center">${d}</div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells}</div>
    <div class="legend"><span><i style="background:var(--brand)"></i>今天</span><span><i style="background:var(--brand-soft)"></i>有面试</span></div>
  </div>`;
}

const AI_FEATURES = [
  ["JD 分析", "把岗位 JD 贴进来，按五维口径拆出匹配点与缺口", "分析一下我手上匹配度最高的岗位"],
  ["简历优化", "对着目标岗位挑出该突出的经历与数字", "帮我看看简历该突出什么"],
  ["模拟面试", "按简历与岗位生成面试问题，给出回答要点", "给我 3 个研发助理面试问题"],
  ["面试复盘", "把面试记录换成下一场的改进项", "复盘一下我最近的面试"],
  ["Offer 对比", "多维度摊开比较，避免只看月薪", "帮我比一下手上的 Offer"],
  ["薪资谈判", "按广东食品研发行情给话术", "薪资怎么谈"]
];

function aiReply(q) {
  const t = q.toLowerCase();
  const top = [...db.jobs].sort((a, b) => b.match - a.match)[0];
  if (/jd|岗位|分析/.test(t)) {
    if (!top) return "库里还没有岗位。先去「岗位管理」添加一条，我再按五维拆给你看。";
    return `按你的画像，库里匹配度最高的是「${top.company} · ${top.title}」（${top.match}%）。\n\n拆解：\n· 相关性（30）：岗位要的是打样、配方与留样评测，你的小米糕梯度设计、曲奇饼干小试直接对得上。\n· 小试/中试（25）：40 余次小试 + 中试试产 + 作业指导书 2 份。\n· 仪器（20）：TMS-PRO、色差仪、水分仪、Aw、感官评价齐全。\n· 数据（15）：60 余张记录表、20 余批次汇总、Excel 透视表。\n· 加分（10）：CET-6 487、专业前 4%、实验室助理、HACCP 巡检。\n\n要补的：这份 JD 写「1 年以上经验优先」，应届属放宽侧，投递时用项目时长与产出对冲。`;
  }
  if (/简历/.test(t)) return `对着目标岗位，简历第一屏建议这样改：\n1. 求职意向写成「食品研发 / 研发助理（烘焙 · 预制菜）」，别写泛泛的「食品相关岗位」。\n2. 技能栏前置 JD 里的词：打样、配方梯度、留样观察、感官评价、质构。\n3. 项目经历每条按「配方变量 → 做几轮 → 量化结果」写，例如粳米粉:糯米粉 7:3/6:4/5:5、小试 40 余次、硬度较竞品低 23%。\n4. 删掉「熟悉办公软件」这类零信息量句子。`;
  if (/面试|模拟/.test(t)) return `研发助理面试，先准备这 3 个：\n1. 「讲一次你独立完成的小试」——按变量、轮次、检测指标、结论四段说，落到 40 余次与 23% 这个数。\n2. 「产线出现口感波动怎么排查」——从原料批次、配比、关键工艺参数、检测数据四条线拆。\n3. 「你了解 GB 2760 吗」——说出你实际用过的类别与限量，别背目录。\n\n回答时多用「我做过 X，结果是 Y」，少用「我了解 / 我熟悉」。`;
  if (/复盘/.test(t)) {
    const done = db.interviews.filter((i) => i.score);
    if (!done.length) return "还没有打分的面试记录。去「面试中心」给每场打分，我再按分数给改进项。";
    return done.map((i) => `· ${i.company} ${i.round}：${i.score}/10（${i.result}）`).join("\n") + `\n\n共性改进：把「我参与了」换成「我设计了/我执行了」；每场面试准备一个 30 秒的产品级案例。`;
  }
  if (/offer|对比/.test(t)) {
    if (db.offers.length < 2) return "现在只有 " + db.offers.length + " 个 Offer，至少两个才能摊开对比。新增后我会按薪资结构、发展空间、公司文化、薪酬满意度四项排。";
    return "已在「Offer 管理」按四项拉平对比，重点看总包与截止日期，别只看月薪。";
  }
  if (/薪|谈/.test(t)) {
    const ranges = db.jobs.map((j) => j.salary).filter((s) => /\d/.test(s)).slice(0, 3);
    return `广东食品研发助理这一档，公开岗位大多在 ${ranges.join(" / ") || "4-8K"}。\n谈的时候：\n1. 先报区间不报单点：「期望 9-11K，主要看岗位匹配度」。\n2. 用可验证的产出支撑：小试 40 余次、试产异常对照 6 项、作业指导书 2 份。\n3. 问清转正与调薪节奏，应届第一份更该看成长与产线接触面。`;
  }
  return "我可以帮你做：JD 分析、简历优化、模拟面试、面试复盘、Offer 对比、薪资谈判。点下面的快捷问题，或直接说你的情况。\n（说明：这是本地规则回复，没有连接大模型，也不会把你的数据发出去。）";
}

/* ---------- 下载工具 ---------- */
function download(name, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function exportMD() {
  const lines = ["# 罗涛 · 求职工作台导出（" + TODAY.toISOString().slice(0, 10) + "）", "", "## 岗位清单", "", "| 岗位 | 公司 | 城市 | 薪资 | 匹配度 | 阶段 | 来源 |", "|---|---|---|---|---|---|---|"];
  db.jobs.forEach((j) => lines.push(`| ${j.title} | ${j.company} | ${j.city} | ${j.salary} | ${j.match}% | ${j.stage} | ${j.url} |`));
  lines.push("", "## 投递记录", "");
  db.applications.forEach((a) => lines.push(`- ${a.company} · ${a.title}｜${a.date}｜当前：${a.steps[a.current]}${a.note ? "｜备注：" + a.note : ""}`));
  lines.push("", "## 面试", "");
  db.interviews.forEach((i) => lines.push(`- ${i.company} · ${i.round}｜${i.date} ${i.time}｜${i.result}${i.score ? "｜" + i.score + "/10" : ""}`));
  lines.push("", "## 学习计划", "");
  db.plans.forEach((p) => { lines.push(`### ${p.name}（截止 ${p.deadline}）`); p.tasks.forEach((t) => lines.push(`- [${t.done ? "x" : " "}] ${t.title}（${t.date}）`)); });
  const stamp = new Date().toISOString().slice(0, 10);
  download(`职途-导出-${stamp}.md`, lines.join("\n"), "text/markdown;charset=utf-8");
  toast("已导出 Markdown");
}

      fields: [
        { k: "company", label: "公司", value: a?.company }, { k: "title", label: "岗位", value: a?.title },
        { k: "city", label: "地点", value: a?.city },
        { k: "date", label: "投递日期", value: a?.date ?? TODAY.toISOString().slice(0, 10) },
        { k: "steps", label: "阶段链（逗号分隔）", value: (a?.steps || ["投递简历", "简历筛选", "一面", "二面"]).join("，") },
        { k: "current", label: "当前阶段序号（从 0 开始）", type: "number", value: a?.current ?? 0 },
        { k: "status", label: "状态", type: "select", options: ["已投递", "面试中", "已结束"], value: a?.status },
        { k: "note", label: "备注", type: "textarea", rows: 2, value: a?.note }
      ],
      onSubmit(v) {
        if (!v.company) return toast("公司不能为空");
        const steps = (v.steps || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean);
        const rec = { company: v.company, title: v.title || "", city: v.city || "", date: v.date, steps, current: Math.max(0, Math.min(steps.length - 1, Number(v.current) || 0)), status: v.status, note: v.note || "", id: a ? a.id : uid("a") };
        if (a) Object.assign(a, rec); else { db.applications.unshift(rec); db.goals.invested = Math.min(db.goals.monthly, db.goals.invested + 1); }
        save(); closeModal(); render(); toast("已保存投递记录");
      }
    });
  },
  interview(i) {
    openModal({
      title: i ? "面试打分" : "记录面试",
      fields: [
        { k: "company", label: "公司", value: i?.company }, { k: "title", label: "岗位", value: i?.title },
        { k: "round", label: "轮次", value: i?.round, ph: "技术面 / HR 面 / 初面" },
        { k: "date", label: "日期", value: i?.date ?? "2026-11-25" },
        { k: "time", label: "时间", value: i?.time, ph: "14:00–15:00" },
        { k: "place", label: "地点", value: i?.place, ph: "线上 / 公司地址" },
        { k: "score", label: "评分（0-10，未面填 0）", type: "number", value: i?.score ?? 0 },
        { k: "result", label: "结果", type: "select", options: ["待进行", "通过", "未通过"], value: i?.result }
      ],
      onSubmit(v) {
        if (!v.company) return toast("公司不能为空");
        const rec = { ...v, score: Number(v.score) || 0, id: i ? i.id : uid("i") };
        if (i) Object.assign(i, rec); else db.interviews.unshift(rec);
        save(); closeModal(); render(); toast("已保存");
      }
    });
  },
  contact() {
    openModal({
      title: "添加内推联系人",
      fields: [
        { k: "name", label: "联系人" }, { k: "company", label: "公司" }, { k: "role", label: "岗位 / 身份" },
        { k: "date", label: "请求日期", value: TODAY.toISOString().slice(0, 10) },
        { k: "status", label: "状态", type: "select", options: ["待处理", "待回复", "已回复", "沟通中", "已同步", "已拒绝"] },
        { k: "followup", label: "跟进情况", type: "textarea", rows: 2 }
      ],
      onSubmit(v) {
        if (!v.name) return toast("联系人不能为空");
        db.contacts.unshift({ ...v, id: uid("c") });
        save(); closeModal(); render(); toast("已添加");
      }
    });
  },
  plan() {
    openModal({
      title: "新建学习计划",
      fields: [
        { k: "name", label: "计划名称", ph: "如 食品添加剂法规补强" },
        { k: "target", label: "目标岗位", ph: "食品研发 / 品控" },
        { k: "weeks", label: "周期（周）", type: "number", value: 2 },
        { k: "priority", label: "优先级", type: "select", options: ["高", "中", "低"] },
        { k: "deadline", label: "截止日期", value: "2026-12-05" },
        { k: "tasks", label: "任务（一行一条，格式：标题|日期）", type: "textarea", rows: 4, ph: "GB 2760 使用范围梳理|2026-11-28\n标签合规自查|2026-12-02" }
      ],
      onSubmit(v) {
        if (!v.name) return toast("计划名不能为空");
        const tasks = (v.tasks || "").split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
          const [t, d] = l.split("|");
          return { title: (t || "").trim(), date: (d || "").trim(), done: false };
        }).filter((t) => t.title);
        db.plans.unshift({ id: uid("l"), name: v.name, target: v.target || "", weeks: Number(v.weeks) || 1, priority: v.priority, deadline: v.deadline, tasks });
        save(); closeModal(); render(); toast("已新建计划");
      }
    });
  },
  diary() {
    openModal({
      title: "写今天的日记",
      fields: [
        { k: "date", label: "日期", value: TODAY.toISOString().slice(0, 10) },
        { k: "mood", label: "心情（1-5）", type: "number", value: 4 },
        { k: "energy", label: "能量（1-5）", type: "number", value: 3 },
        { k: "tags", label: "标签（逗号分隔）", ph: "面试、复盘", value: "" },
        { k: "text", label: "今天发生了什么", type: "textarea", rows: 4 }
      ],
      onSubmit(v) {
        if (!v.text) return toast("写点什么吧");
        db.diaries.push({ id: uid("d"), date: v.date, mood: Number(v.mood) || 3, energy: Number(v.energy) || 3, text: v.text, tags: (v.tags || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean) });
        save(); closeModal(); render(); toast("已记录");
      }
    });
  },
  node() {
    openModal({
      title: "添加关键节点",
      fields: [
        { k: "title", label: "节点名称" }, { k: "date", label: "日期", value: "2026-12-01" },
        { k: "tag", label: "类型", type: "select", options: ["面试", "投递", "学习", "其他"] }
      ],
      onSubmit(v) {
        if (!v.title) return toast("节点名不能为空");
        db.nodes.push({ ...v, id: uid("n") });
        save(); closeModal(); render(); toast("已添加节点");
      }
    });
  },
  offer() {
    openModal({
      title: "新增 Offer",
      fields: [
        { k: "company", label: "公司" }, { k: "title", label: "岗位" }, { k: "city", label: "城市" },
        { k: "monthly", label: "月薪（K）", type: "number", value: 8 },
        { k: "months", label: "发薪月数", type: "number", value: 13 },
        { k: "total", label: "总包（万/年）", type: "number", value: 12 },
        { k: "deadline", label: "确认截止", value: "2026-12-01" },
        { k: "space", label: "发展空间（1-10）", type: "number", value: 7 },
        { k: "culture", label: "公司文化（1-10）", type: "number", value: 7 },
        { k: "pay", label: "薪酬满意度（1-10）", type: "number", value: 7 },
        { k: "score", label: "综合评分（0-100）", type: "number", value: 70 },
        { k: "benefits", label: "福利（逗号分隔）", ph: "五险一金、包吃住" }
      ],
      onSubmit(v) {
        if (!v.company) return toast("公司不能为空");
        db.offers.unshift({ ...v, benefits: (v.benefits || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean), id: uid("o") });
        save(); closeModal(); render(); toast("已新增 Offer");
      }
    });
  },
  material() {
    openModal({
      title: "新增资料",
      fields: [
        { k: "type", label: "类型", type: "select", options: ["面经", "笔试题", "公司分析", "行业报告", "自我介绍"] },
        { k: "title", label: "标题" }, { k: "summary", label: "摘要", type: "textarea", rows: 3 },
        { k: "source", label: "来源", ph: "公司官网 / 自整理" },
        { k: "date", label: "日期", value: TODAY.toISOString().slice(0, 10) },
        { k: "tags", label: "关键词（逗号分隔）" }
      ],
      onSubmit(v) {
        if (!v.title) return toast("标题不能为空");
        db.materials.unshift({ ...v, tags: (v.tags || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean), id: uid("m") });
        save(); closeModal(); render(); toast("已新增资料");
      }
    });
  }
};

/* ---------- 全局事件 ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  const find = (arr) => arr.find((x) => x.id === id);
  switch (act) {
    case "go": go(t.dataset.view); break;
    case "menu": $(".sidebar").classList.toggle("open"); break;
    case "modal-close": closeModal(); break;
    case "modal-submit": submitModal(); break;
    case "job-add": F.job(); break;
    case "job-edit": F.job(find(db.jobs)); break;
    case "job-del": db.jobs = db.jobs.filter((x) => x.id !== id); save(); render(); toast("已删除"); break;
    case "job-fav": { const j = find(db.jobs); j.favorite = !j.favorite; save(); render(); break; }
    case "job-view": {
      const j = find(db.jobs);
      openModal({
        title: j.title,
        fields: [], onSubmit() {},
        onRender: null
      });
      $("#modal").innerHTML = `<h3>${esc(j.title)}</h3>
        <div class="muted" style="margin-bottom:12px">${esc(j.company)} · ${esc(j.city)} · ${money(j.salary)} · ${esc(j.type)}</div>
        <div class="form">
          <div><label>匹配度</label><div class="bar"><i style="width:${j.match}%"></i></div><div class="muted" style="margin-top:4px">${j.match}%</div></div>
          <div><label>当前阶段</label><div>${stageChip(j.stage)}</div></div>
          <div><label>风险 / 备注</label><div class="muted">${esc(j.note || "—")}</div></div>
          <div><label>原始链接</label><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.url)}</a></div>
        </div>
        <div class="foot"><button class="btn" data-act="modal-close">关闭</button></div>`;
      $("#mask").classList.add("on");
      break;
    }
    case "resume-add": F.resume(); break;
    case "resume-del": db.resumes = db.resumes.filter((x) => x.id !== id); save(); render(); break;
    case "project-add": F.project(); break;
    case "project-del": db.projects = db.projects.filter((x) => x.id !== id); save(); render(); break;
    case "apply-add": F.apply(); break;
    case "apply-edit": F.apply(find(db.applications)); break;
    case "apply-del": db.applications = db.applications.filter((x) => x.id !== id); save(); render(); break;
    case "apply-advance": {
      const a = find(db.applications);
      a.current = Math.min(a.steps.length - 1, a.current + 1);
      if (a.current >= 2) a.status = "面试中";
      if (a.current === a.steps.length - 1) a.status = "已结束";
      save(); render(); toast("已推进到「" + a.steps[a.current] + "」");
      break;
    }
    case "apply-step": {
      const a = find(db.applications);
      a.current = Number(t.dataset.idx);
      a.status = a.current >= a.steps.length - 1 ? "已结束" : a.current >= 2 ? "面试中" : "已投递";
      save(); render();
      break;
    }
    case "interview-add": F.interview(); break;
    case "interview-score": F.interview(find(db.interviews)); break;
    case "interview-del": db.interviews = db.interviews.filter((x) => x.id !== id); save(); render(); break;
    case "contact-add": F.contact(); break;
    case "contact-del": db.contacts = db.contacts.filter((x) => x.id !== id); save(); render(); break;
    case "plan-add": F.plan(); break;
    case "plan-del": db.plans = db.plans.filter((x) => x.id !== id); save(); render(); break;
    case "plan-task": {
      const p = find(db.plans); const i = Number(t.dataset.idx);
      p.tasks[i].done = !p.tasks[i].done; save(); render(); break;
    }
    case "plan-ai": {
      const gap = ["GB 2760 添加剂使用范围与限量", "TPA 质构参数与产品口感对应", "预制菜保质期与稳定性测试方法", "HACCP 关键控制点判定"];
      openModal({
        title: "AI 生成的学习计划（按岗位缺口）",
        fields: [{ k: "name", label: "计划名称", value: "食品研发缺口补强" }, { k: "target", label: "目标岗位", value: "食品研发 / 研发助理" },
          { k: "weeks", label: "周期（周）", type: "number", value: 3 }, { k: "priority", label: "优先级", type: "select", options: ["高", "中", "低"] },
          { k: "deadline", label: "截止日期", value: "2026-12-12" },
          { k: "tasks", label: "任务（一行一条，可改）", type: "textarea", rows: 5, value: gap.map((g) => g + "|2026-12-12").join("\n") }],
        onSubmit(v) {
          const tasks = (v.tasks || "").split("\n").filter(Boolean).map((l) => { const [a, b] = l.split("|"); return { title: (a || "").trim(), date: (b || "").trim(), done: false }; });
          db.plans.unshift({ id: uid("l"), name: v.name, target: v.target, weeks: Number(v.weeks), priority: v.priority, deadline: v.deadline, tasks });
          save(); closeModal(); render(); toast("已生成计划，可继续编辑");
        }
      });
      break;
    }
    case "diary-add": F.diary(); break;
    case "diary-del": db.diaries = db.diaries.filter((x) => x.id !== id); save(); render(); break;
    case "node-add": F.node(); break;
    case "node-del": db.nodes = db.nodes.filter((x) => x.id !== id); save(); render(); break;
    case "offer-add": F.offer(); break;
    case "offer-del": db.offers = db.offers.filter((x) => x.id !== id); save(); render(); break;
    case "material-add": F.material(); break;
    case "material-del": db.materials = db.materials.filter((x) => x.id !== id); save(); render(); break;
    case "mat-type": state.matType = t.dataset.t; render(); break;
    case "ai-ask": {
      state.chat.push({ role: "me", text: t.dataset.q });
      state.chat.push({ role: "ai", text: aiReply(t.dataset.q) });
      state.view = "assistant"; render();
      const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight;
      break;
    }
    case "ai-send": {
      const inp = $("#aiInput"); if (!inp || !inp.value.trim()) return;
      const q = inp.value.trim();
      state.chat.push({ role: "me", text: q });
      state.chat.push({ role: "ai", text: aiReply(q) });
      render();
      const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight;
      break;
    }
    case "ai-focus": { const i = $("#aiInput"); if (i) { i.focus(); i.scrollIntoView({ block: "center" }); } break; }
    case "export-json": download("职途-数据备份.json", JSON.stringify(db, null, 2), "application/json"); toast("已导出 JSON 备份"); break;
    case "export-md": exportMD(); break;
    case "reset-data":
      openModal({
        title: "恢复初始数据",
        fields: [], onSubmit() {},
        onRender: null
      });
      $("#modal").innerHTML = `<h3>恢复初始数据</h3><p class="muted">会把本机存的所有改动清空，回到食品研发的初始示例数据。这一步不能撤销，建议先「导出数据」备份。</p>
        <div class="foot"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-act="reset-do">确认恢复</button></div>`;
      $("#mask").classList.add("on");
      break;
    case "reset-do":
      localStorage.removeItem(DB_KEY); db = clone(window.SEED); save(); closeModal(); go("dashboard"); toast("已恢复初始数据"); break;
    case "notify": toast("2 条提醒：11-24 佳味天成初面、11-26 锦华技术面"); break;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "q") {
    state.q = e.target.value;
    render();
    const el = $("#q");
    if (el) { el.value = state.q; el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  } else if (e.target.id === "globalSearch") {
    state.q = e.target.value;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "globalSearch") { go("jobs"); }
});
document.addEventListener("change", (e) => {
  const s = e.target.closest("[data-act='job-filter']");
  if (s) { state[s.dataset.key] = s.value; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "aiInput") { const b = document.querySelector("[data-act='ai-send']"); if (b) b.click(); }
});
$("#mask").addEventListener("click", (e) => { if (e.target.id === "mask") closeModal(); });

/* ---------- 启动 ---------- */
function boot() {
  $("#nav").innerHTML = NAV.map(([k, n, ic]) => `<a href="#/${k}" data-act="go" data-view="${k}" data-view-key="${k}"><span class="ic">${ic}</span>${esc(n)}${k === "apply" ? '<span class="dot" id="navDot"></span>' : ""}</a>`).join("");
  const hash = (location.hash || "").replace("#/", "");
  state.view = VIEWS[hash] ? hash : "dashboard";
  render();
  window.addEventListener("hashchange", () => {
    const k = (location.hash || "").replace("#/", "");
    if (VIEWS[k] && k !== state.view) { state.view = k; render(); window.scrollTo({ top: 0 }); }
  });
}
boot();

</script>
</body>
</html>
